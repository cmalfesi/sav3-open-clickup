name: SAV3 checks
on:
  push:
    branches: [main, sav3-sites, sav3-production-v5]
  pull_request:
    branches: [main, sav3-sites]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:data
      - run: pnpm prisma:generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
